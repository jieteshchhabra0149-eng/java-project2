spring.application.name=NexusChat
server.port=8080

spring.threads.virtual.enabled=true

spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# H2 persistence
spring.datasource.url=jdbc:h2:file:./data/nexuschat;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis STOMP relay (optional — set nexus.redis.enabled=true and start Redis)
nexus.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Gemini — prefer GEMINI_API_KEY env var
gemini.api-key=${GEMINI_API_KEY:AIzaSyCq_wQmVXnifHEqBAhJpfdPZXej_aeMUcM}
gemini.model=gemini-2.5-flash
gemini.api-base-url=https://generativelanguage.googleapis.com/v1beta

# Rate limits
nexus.ai.rate-limit-per-minute=20
nexus.chat.rate-limit-per-minute=60

logging.level.com.chatapp=INFO
logging.level.org.springframework.web.socket=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
